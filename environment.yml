name: mpc
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - matplotlib
  - tqdm
  - control  # python-control
  - pip:
      # CPU-only PyTorch wheels
      - --index-url https://download.pytorch.org/whl/cpu
      - torch==2.2.2
      - torchvision==0.17.2
      - torchaudio==2.2.2
      # Mamba SSM
      - mamba-ssm
